name: Lint

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "data/*.metainfo.xml"
      - "data/*.desktop"

permissions:
  contents: read

jobs:
  go:
    if: ${{ !startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login != 'weblate' }}
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install packages
        run: dnf install -y git libadwaita-devel gtk4-devel gobject-introspection-devel

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - id: go-cache-paths
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.gocache }}
            ${{ steps.go-cache-paths.outputs.gomodcache }}
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  metainfo:
    if: ${{ !startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login != 'weblate' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils

      - run: appstreamcli validate --no-net data/space.f1nn.chorus.metainfo.xml

      - run: desktop-file-validate data/space.f1nn.chorus.desktop
